<style>

html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--navy);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.panel{width:min(720px,100%);display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:28px;align-items:center;padding:28px;border-radius:28px;background:#131d3d;box-shadow:0 24px 70px rgba(0,0,0,.45)}

canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hidden{display:none}

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { XREstimatedLight } from "three/addons/webxr/XREstimatedLight.js";

const startBtn = document.querySelector("#start");
const statusEl = document.querySelector("#status");
const ui = document.querySelector("#ui");
const setStatus = t => statusEl.textContent = t;

/* ---------- Parametri regolabili ---------- */
const CFG = {
  model: "models/nativita.glb", // la natività intera, tutta in un solo file
  modelScale: 0.9,    // 1 = misura originale del file (Maria alta ~1 m, i Magi ~1,8 m)
  mangerX: 0.04,      // punto del modello che finisce al centro (la mangiatoia), in unità del modello
  mangerZ: 0.56,
  magiFront: 5.82,    // il punto del gruppo dei Magi più vicino a te (unità del modello)
  startZ: 1.2,        // distanza tra te e i Magi quando la scena compare (m)
  sideX: 1.4,         // distanza dei poster dal centro (m): più basso = più vicini ai personaggi (ma occhio al passaggio)
  turn: 0.45,         // quanto i poster si girano verso di te (radianti, 0 = frontali alla natività)
  posterW: 0.9, posterH: 1.2,  // misura dei poster (m)
  posterY: 1.3,       // altezza del centro del poster dal pavimento
  showStar: true,     // stella luminosa sopra la mangiatoia (nel file non c'è)
  starY: 1.5,         // altezza della stella (m)
  song: "audio/canzone.mp3", // la canzone: parte da sola quando premi il bottone, in loop (metti "" per toglierla)
  songVolume: 0.5,    // da 0 a 1
  exposure: 1.0,      // luminosità generale (tone mapping ACES): alza o abbassa se la scena è troppo chiara/scura
  guide: "guida.png", // il logo che fa da guida
  guideSize: 0.30,    // grandezza della guida (m)
  guideSide: 0.5,     // quanto sta a destra di te (m)
  guideAhead: 0.55,   // quanto sta davanti a te (m)
  near: 2.6,          // entro questa distanza (m) un poster guardato conta come "letto"
  spawnDelay: 1.5,    // secondi prima che la scena compaia
  gazeDeg: 16         // sguardo dentro questo angolo = poster evidenziato
};

/* ---------- Le stazioni della storia (modifica qui i testi) ----------
   side: 1 destra, -1 sinistra · zm: posizione lungo la natività, in unità del modello
   (0 = mangiatoia, più grande = più vicino ai Magi) · icon: crown, gift, star, family */
const STATIONS = [

          "Attraversano deserti e regni per cercare il re dei Giudei appena nato, passando prima da Gerusalemme, dal re Erode."],
    note:"Matteo 2, 1-8",

  { side:1, zm:3.2, icon:"gift", label:"I doni",

          "L’oro è il dono per un re. L’incenso si bruciava in onore di Dio. La mirra è una resina profumata usata anche per la sepoltura. Nei secoli sono stati letti come segni di regalità, divinità e umanità."],
    note:"Matteo 2, 11",
    guide:"Oro, incenso e mirra: tre doni che raccontano chi è questo bambino." },

    guide:"La stella si è fermata proprio qui. Il viaggio è finito: guarda la mangiatoia!" },

          "Nasce Gesù, nome che significa «Dio salva». Maria lo avvolge in fasce e lo adagia in una mangiatoia. I pastori corrono a vederlo, i Magi si inchinano e gli offrono i loro doni: è il Natale."],
    note:"Luca 2, 1-16 · Matteo 1, 18-25 · Matteo 2, 11",
    guide:"Maria, Giuseppe e Gesù: il cuore del presepe. Fermiamoci un momento in silenzio." }
];

/* ---------- Utilità ---------- */
const easeOutBack = t => { const c=1.70158; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
const clamp01 = v => Math.min(1, Math.max(0, v));
const FONT = "system-ui,-apple-system,'Segoe UI',sans-serif", SERIF = "Georgia,'Times New Roman',serif";

function roundRect(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function wrap(g, text, maxW){
  const lines = []; let line = "";
  for (const w of text.split(" ")){
    const test = line ? line+" "+w : w;
    if (g.measureText(test).width > maxW && line){ lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function star(g,x,y,r){
  g.beginPath();
  for (let i=0;i<8;i++){ const a=i*Math.PI/4 - Math.PI/2, rr = i%2 ? r*0.38 : r; g.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
  g.closePath(); g.fill();
}

/* ---------- Poster di vetro (disegnati su canvas) ---------- */
const PW = 1280, PH = Math.round(PW * CFG.posterH / CFG.posterW);
const GOLD = "rgba(255,210,122,.95)";

function drawIcon(g, kind, cx, cy, R){
  const gd = g.createLinearGradient(cx, cy-R, cx, cy+R);
  gd.addColorStop(0, "#fff1c4"); gd.addColorStop(1, "#f0b244");
  g.fillStyle = gd; g.strokeStyle = gd; g.lineCap = "round"; g.lineJoin = "round";
  if (kind === "crown"){
    g.beginPath();
    g.moveTo(cx-.62*R, cy+.38*R); g.lineTo(cx-.72*R, cy-.32*R); g.lineTo(cx-.3*R, cy+.02*R);
    g.lineTo(cx, cy-.5*R); g.lineTo(cx+.3*R, cy+.02*R); g.lineTo(cx+.72*R, cy-.32*R); g.lineTo(cx+.62*R, cy+.38*R);
    g.closePath(); g.fill();
    roundRect(g, cx-.64*R, cy+.46*R, 1.28*R, .17*R, .06*R); g.fill();
    for (const [x,y] of [[-.72,-.4],[0,-.58],[.72,-.4]]){ g.beginPath(); g.arc(cx+x*R, cy+y*R, .08*R, 0, Math.PI*2); g.fill(); }
  } else if (kind === "gift"){
    roundRect(g, cx-.52*R, cy-.02*R, 1.04*R, .62*R, .05*R); g.fill();
    roundRect(g, cx-.6*R, cy-.26*R, 1.2*R, .24*R, .05*R); g.fill();
    g.fillStyle = "rgba(13,22,48,.85)"; g.fillRect(cx-.07*R, cy-.26*R, .14*R, .86*R);
    g.lineWidth = .07*R; g.strokeStyle = gd;
    g.beginPath(); g.ellipse(cx-.22*R, cy-.42*R, .22*R, .13*R, -.5, 0, Math.PI*2); g.stroke();
    g.beginPath(); g.ellipse(cx+.22*R, cy-.42*R, .22*R, .13*R, .5, 0, Math.PI*2); g.stroke();
  } else if (kind === "star"){
    star(g, cx, cy, .95*R);
    g.lineWidth = .05*R;
    for (let k=0;k<8;k++){ const a=k*Math.PI/4+Math.PI/8, r1=1.05*R, r2=1.22*R;
      g.beginPath(); g.moveTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1); g.lineTo(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2); g.stroke(); }
  } else if (kind === "family"){
    const fig = (x, hr, sh, y0) => {
      g.lineWidth = .045*R; g.beginPath(); g.arc(x, y0-.02*R, hr+.08*R, 0, Math.PI*2); g.stroke();
      g.beginPath(); g.arc(x, y0, hr, 0, Math.PI*2); g.fill();
      g.beginPath(); g.arc(x, y0+hr+.12*R+sh, sh+.04*R, Math.PI, 0); g.closePath(); g.fill();
    };
    fig(cx-.55*R, .16*R, .26*R, cy-.28*R);
    fig(cx+.55*R, .16*R, .26*R, cy-.28*R);
    fig(cx, .12*R, .17*R, cy+.12*R);
  }
}

function drawPoster(st, idx, total){
  const c = document.createElement("canvas"); c.width = PW; c.height = PH;
  const g = c.getContext("2d"), M = 100, W = PW - M*2, CX = PW/2;

  // vetro: velo blu notte, alone caldo in alto, riflessi diagonali
  roundRect(g,10,10,PW-20,PH-20,56);
  const bg = g.createLinearGradient(0,0,PW*.6,PH);
  bg.addColorStop(0,"rgba(34,56,120,.80)"); bg.addColorStop(.55,"rgba(14,24,64,.86)"); bg.addColorStop(1,"rgba(8,14,40,.92)");
  g.fillStyle = bg; g.fill();
  g.save(); g.clip();
  const rg = g.createRadialGradient(CX,250,10,CX,250,640);
  rg.addColorStop(0,"rgba(255,200,110,.30)"); rg.addColorStop(1,"rgba(255,200,110,0)");
  g.fillStyle = rg; g.fillRect(0,0,PW,PH);
  g.fillStyle = "rgba(255,255,255,.07)";
  g.beginPath(); g.moveTo(PW*.05,0); g.lineTo(PW*.45,0); g.lineTo(0,PH*.3); g.lineTo(0,PH*.12); g.fill();
  g.fillStyle = "rgba(255,255,255,.04)";
  g.beginPath(); g.moveTo(PW*.55,0); g.lineTo(PW*.65,0); g.lineTo(0,PH*.5); g.lineTo(0,PH*.43); g.fill();
  g.restore();

  // triplice cornice con stelline negli angoli
  roundRect(g,10,10,PW-20,PH-20,56); g.lineWidth = 5; g.strokeStyle = "rgba(255,255,255,.65)"; g.stroke();
  roundRect(g,38,38,PW-76,PH-76,42); g.lineWidth = 3; g.strokeStyle = "rgba(255,210,122,.75)"; g.stroke();
  roundRect(g,52,52,PW-104,PH-104,32); g.lineWidth = 1.5; g.strokeStyle = "rgba(255,210,122,.3)"; g.stroke();
  g.fillStyle = GOLD;
  for (const [x,y] of [[78,78],[PW-78,78],[78,PH-78],[PW-78,PH-78]]) star(g, x, y, 15);

  // medaglione con l’icona
  const cy = 262;
  const ig = g.createRadialGradient(CX,cy,10,CX,cy,170);
  ig.addColorStop(0,"rgba(255,200,110,.38)"); ig.addColorStop(1,"rgba(255,200,110,0)");
  g.fillStyle = ig; g.beginPath(); g.arc(CX,cy,170,0,Math.PI*2); g.fill();
  g.lineWidth = 4; g.strokeStyle = GOLD; g.beginPath(); g.arc(CX,cy,124,0,Math.PI*2); g.stroke();
  g.lineWidth = 1.5; g.strokeStyle = "rgba(255,210,122,.45)"; g.beginPath(); g.arc(CX,cy,138,0,Math.PI*2); g.stroke();
  drawIcon(g, st.icon, CX, cy, 84);

  // testi
  g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = 8; g.shadowOffsetY = 2;
  g.textBaseline = "alphabetic"; g.textAlign = "center";
  let y = 478;
  g.fillStyle = GOLD; g.font = `600 36px ${FONT}`; if ("letterSpacing" in g) g.letterSpacing = "5px";
  g.fillText(st.kicker.toUpperCase(), CX, y);
  if ("letterSpacing" in g) g.letterSpacing = "0px";

  let tf = 108, tl;
  for (; tf >= 72; tf -= 4){ g.font = `700 ${tf}px ${SERIF}`; tl = wrap(g, st.title, W); if (tl.length <= 2) break; }
  g.fillStyle = "#fff6de";
  y += 18;
  for (const l of tl){ y += tf*1.06; g.fillText(l, CX, y); }

  // filetto con stella al centro
  y += 46;
  g.shadowColor = "transparent";
  for (const dir of [-1,1]){
    const x0 = CX + dir*34, x1 = CX + dir*(W/2);
    const dv = g.createLinearGradient(x0,0,x1,0);
    dv.addColorStop(0,"rgba(255,210,122,.95)"); dv.addColorStop(1,"rgba(255,210,122,0)");
    g.fillStyle = dv; g.fillRect(Math.min(x0,x1), y-1.5, Math.abs(x1-x0), 3);
  }
  g.fillStyle = GOLD; star(g, CX, y, 17);
  y += 66;

  // corpo: si rimpicciolisce finché sta nello spazio disponibile
  g.shadowColor = "rgba(0,0,0,.5)"; g.shadowBlur = 6; g.shadowOffsetY = 2; g.textAlign = "left";
  const maxH = (PH - 250) - y;
  let fs = 52, paras;
  for (; fs >= 32; fs -= 2){
    g.font = `400 ${fs}px ${FONT}`;
    paras = st.body.map(p => wrap(g, p, W));
    const h = paras.reduce((s,p) => s + p.length*fs*1.42, 0) + (paras.length-1)*fs*.55;
    if (h <= maxH) break;
  }
  g.fillStyle = "rgba(247,249,253,.98)";
  for (const p of paras){
    for (const l of p){ y += fs*1.42; g.fillText(l, M, y); }
    y += fs*.55;
  }

  // piè: filetto, fonte, numero e puntini di avanzamento
  g.shadowColor = "transparent";
  const fl = g.createLinearGradient(M,0,PW-M,0);
  fl.addColorStop(0,"rgba(255,210,122,0)"); fl.addColorStop(.5,"rgba(255,210,122,.8)"); fl.addColorStop(1,"rgba(255,210,122,0)");
  g.fillStyle = fl; g.fillRect(M, PH-212, W, 2.5);
  g.font = `italic 32px ${FONT}`; g.fillStyle = "rgba(255,210,122,.9)"; g.textAlign = "left";
  g.fillText(st.note, M, PH-150);
  g.fillStyle = "rgba(247,249,253,.9)"; g.font = `600 34px ${FONT}`; g.textAlign = "right";
  g.fillText(`${idx+1} / ${total}`, PW-M, PH-150);
  for (let i=0;i<total;i++){
    g.fillStyle = i === idx ? GOLD : "rgba(255,255,255,.3)";
    g.beginPath(); g.arc(CX + (i-(total-1)/2)*38, PH-98, i === idx ? 11 : 8, 0, Math.PI*2); g.fill();
  }
  return c;
}
function glowTexture(){
  const w = 512, h = Math.round(w*PH/PW), ins = 36, c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.shadowColor = "#ffc861"; g.shadowBlur = 28; g.strokeStyle = "#ffd27a"; g.lineWidth = 5;
  roundRect(g, ins, ins, w-ins*2, h-ins*2, 26); g.stroke();
  return { c, sx: w/(w-ins*2), sy: h/(h-ins*2) };
}

/* ---------- La natività (un solo GLB) + stella ---------- */
function makeStar(){
  const sh = new THREE.Shape();
  for (let i=0;i<16;i++){
    const a = i*Math.PI/8 - Math.PI/2, r = i%2 ? .38 : 1;
    i ? sh.lineTo(Math.cos(a)*r, Math.sin(a)*r) : sh.moveTo(Math.cos(a)*r, Math.sin(a)*r);
  }
  sh.closePath();
  const geo = new THREE.ExtrudeGeometry(sh, { depth:.22, bevelEnabled:true, bevelSize:.04, bevelThickness:.04, bevelSegments:2 });
  geo.center();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:0xffd27a, emissive:0xffb43a, emissiveIntensity:1.5, metalness:.3, roughness:.4 }));
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"), rg = g.createRadialGradient(64,64,4,64,64,64);
  rg.addColorStop(0,"rgba(255,220,130,.9)"); rg.addColorStop(.4,"rgba(255,190,90,.25)"); rg.addColorStop(1,"rgba(255,190,90,0)");
  g.fillStyle = rg; g.fillRect(0,0,128,128);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, toneMapped:false }));
  halo.scale.set(3.4,3.4,1);
  const grp = new THREE.Group(); grp.add(mesh, halo); grp.scale.setScalar(.14);
  grp.userData.mesh = mesh;
  return grp;
}

function loadNativity(){
  return new Promise((resolve, reject) => {
    new GLTFLoader().load(CFG.model, gltf => {
      const model = gltf.scene, s = CFG.modelScale;
      model.scale.setScalar(s);
      model.traverse(o => { if (o.isMesh) for (const k of ["map","normalMap","aoMap"]) if (o.material[k]) o.material[k].anisotropy = 4; });
      model.position.set(-CFG.mangerX*s, 0, -CFG.mangerZ*s);   // la mangiatoia al centro
      model.updateMatrixWorld(true);
      model.position.y = -new THREE.Box3().setFromObject(model).min.y;  // il punto più basso (paglia) appoggia sul pavimento
      resolve(model);
    }, e => {
      const mb = (e.loaded/1048576).toFixed(1);
      setStatus(e.lengthComputable ? `Carico la natività… ${Math.round(e.loaded/e.total*100)}% (${mb} MB)` : `Carico la natività… ${mb} MB`);
    }, err => reject(err));
  });
}

/* ---------- Canzone ---------- */
let song = null, fadeT = 0;
function setupSong(){
  if (!CFG.song) return;
  song = new Audio(CFG.song); song.loop = true; song.preload = "auto"; song.volume = 0;
  song.addEventListener("error", () => { console.warn("Canzone non trovata:", CFG.song); song = null; });
}
function fadeSong(target){          // sale o scende piano piano; a zero mette in pausa
  clearInterval(fadeT);
  fadeT = setInterval(() => {
    if (!song){ clearInterval(fadeT); return; }
    const d = target - song.volume;
    if (Math.abs(d) < .03){ song.volume = target; clearInterval(fadeT); if (!target) song.pause(); return; }
    song.volume = Math.min(1, Math.max(0, song.volume + Math.sign(d)*.03));
  }, 60);
}
function playSong(){
  if (!song) return;
  song.play().then(() => fadeSong(CFG.songVolume)).catch(e => console.warn("Audio bloccato:", e));
}

/* ---------- La guida: il logo ci accompagna lungo la visita ---------- */
const GUIDE = {
  hello: "Ciao! Sono la guida dell’ISISS Matese. Seguimi: partiamo dai Re Magi.",
  next: t => `Vieni, ti aspetto qui accanto: ora leggiamo «${t}».`,
  end: "Siamo arrivati in fondo. Buon Natale da tutto l’ISISS Matese!",
  tips: ["Per spostare la natività stringi il grip, guarda il pavimento e conferma col grilletto.",
         "Cammina piano intorno alla natività: i poster si illuminano quando li guardi.",
         "Quando vuoi un consiglio, tocca me."]
};
const guide = { grp:null, logo:null, hit:null, bubble:null, bCanvas:null, bTex:null, pos:new THREE.Vector3(), ready:false,
                now:0, msgUntil:0, nudgeAt:0, endAt:0, introDone:false, tipI:0 };
const right = new THREE.Vector3(), tgt = new THREE.Vector3(), v1 = new THREE.Vector3(), v2 = new THREE.Vector3();

function say(text, secs = 7){
  const c = guide.bCanvas, g = c.getContext("2d"), W = c.width, H = c.height, tail = 56, bh = H - tail - 16;
  g.clearRect(0,0,W,H);
  roundRect(g, 8, 8, W-16, bh, 44);
  const bg = g.createLinearGradient(0,0,0,H); bg.addColorStop(0,"rgba(30,50,110,.93)"); bg.addColorStop(1,"rgba(10,18,48,.96)");
  g.fillStyle = bg; g.fill(); g.lineWidth = 5; g.strokeStyle = GOLD; g.stroke();
  g.beginPath(); g.moveTo(W/2-36, bh+4); g.lineTo(W/2, H-6); g.lineTo(W/2+36, bh+4); g.closePath();
  g.fillStyle = "rgba(14,24,60,.96)"; g.fill();
  g.fillStyle = "#fff6de"; g.textAlign = "center";
  let fs = 62, lines;
  for (; fs >= 34; fs -= 2){ g.font = `600 ${fs}px ${FONT}`; lines = wrap(g, text, W-110); if (lines.length*fs*1.3 <= bh-50) break; }
  let y = 8 + (bh - lines.length*fs*1.3)/2 + fs*.98;
  for (const l of lines){ g.fillText(l, W/2, y); y += fs*1.3; }
  guide.bTex.needsUpdate = true;
  guide.msgUntil = guide.now + secs;
}
function onVisit(i){
  say(STATIONS[i].guide, 8);
  if (stations.every(s => s.visited)) guide.endAt = guide.msgUntil + 1.5;
  else guide.nudgeAt = guide.msgUntil + 2.5;
}
function updateGuide(dt, t, since){
  const G = guide; G.now = t;
  const e = Math.max(0.001, easeOutBack(clamp01((since - 1.2)/.7)));
  G.grp.visible = since > 1.2; G.grp.scale.setScalar(e);
  if (!G.introDone && since > 1.9){ G.introDone = true; say(GUIDE.hello, 7); G.nudgeAt = G.msgUntil + 25; }

  // dove andare: il primo poster non ancora letto
  const goal = stations.find(s => !s.visited);
  right.set(-fwd.z, 0, fwd.x);
  tgt.copy(head).addScaledVector(right, CFG.guideSide).addScaledVector(fwd, CFG.guideAhead);
  if (goal){                         // se il poster è lontano la guida si sposta verso di lui, come per indicarlo
    goal.poster.getWorldPosition(v1).sub(head); v1.y = 0;
    const dist = v1.length(); v1.normalize();
    const pull = clamp01((dist - 1.3)/1.5) * .6;
    v2.copy(head).addScaledVector(v1, Math.max(0, Math.min(dist - .7, 1.1))).addScaledVector(right, .25);
    tgt.lerp(v2, pull);
  }
  tgt.y = head.y - .12 + Math.sin(t*1.6)*.03;
  if (!G.ready){ G.pos.copy(tgt); G.ready = true; }
  G.pos.lerp(tgt, 1 - Math.exp(-dt*2.5));       // la segue con un po’ di ritardo, come se fluttuasse
  G.grp.position.copy(G.pos);
  G.grp.lookAt(head.x, G.pos.y, head.z);
  G.logo.rotation.set(0, Math.sin(t*.9)*.25, Math.sin(t*1.3)*.05);

  if (G.nudgeAt && t > G.nudgeAt && t > G.msgUntil){
    if (goal){ say(GUIDE.next(STATIONS[stations.indexOf(goal)].title), 6); G.nudgeAt = G.msgUntil + 25; } else G.nudgeAt = 0;
  }
  if (G.endAt && t > G.endAt){ say(GUIDE.end, 14); G.endAt = 0; }
  const k = t < G.msgUntil ? 1 : 0.001, b = G.bubble.scale.x;
  G.bubble.scale.setScalar(b + (k - b)*(1 - Math.exp(-dt*8)));
  G.bubble.visible = b > .01 || k === 1;
}

function softGlow(){
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"), r = g.createRadialGradient(64,64,4,64,64,64);
  r.addColorStop(0,"rgba(255,215,130,.8)"); r.addColorStop(.5,"rgba(255,190,90,.22)"); r.addColorStop(1,"rgba(255,190,90,0)");
  g.fillStyle = r; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c);
}
function shadowTexture(){            // ombra morbida sul pavimento, per ancorare la natività alla stanza
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"), r = g.createRadialGradient(128,128,10,128,128,128);
  r.addColorStop(0,"rgba(0,0,0,.8)"); r.addColorStop(.6,"rgba(0,0,0,.38)"); r.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle = r; g.fillRect(0,0,256,256); return new THREE.CanvasTexture(c);
}

/* ---------- Scena ---------- */
let scene, camera, renderer, root, nat, starObj, session = null, last = null, startTime = 0;
let xrOK = false, modelOK = false;
let reticle, hitSrc = null, placeMode = false, roomEnv, hemi, sun;
const S = { placed:false, placedAt:0 };
const stations = [];
const head = new THREE.Vector3(), fwd = new THREE.Vector3(), look = new THREE.Vector3(), tmp = new THREE.Vector3();

function init(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 30);
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType("local-floor");
  document.body.appendChild(renderer.domElement);

  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = CFG.exposure;
  renderer.xr.setFoveation(1);       // il Quest sfuoca i bordi della vista: meno lavoro per la GPU

  // luci: ambiente morbido (PBR) + luci dirette; se il visore stima la luce della stanza, usa quella
  roomEnv = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environment = roomEnv; scene.environmentIntensity = .6;
  hemi = new THREE.HemisphereLight(0xffffff, 0x9a7a55, 2.2); scene.add(hemi);
  sun = new THREE.DirectionalLight(0xfff0d8, 2.6); sun.position.set(1.5, 4, 2.5); scene.add(sun);
  const xrLight = new XREstimatedLight(renderer);
  xrLight.addEventListener("estimationstart", () => {
    scene.add(xrLight); hemi.visible = sun.visible = false;
    if (xrLight.environment) scene.environment = xrLight.environment;
  });
  xrLight.addEventListener("estimationend", () => { scene.remove(xrLight); hemi.visible = sun.visible = true; scene.environment = roomEnv; });

  root = new THREE.Group(); root.visible = false; scene.add(root);

  // la natività: davanti a te c'è il corridoio, in fondo la mangiatoia; i Magi arrivano verso di te
  const s = CFG.modelScale, manger = -(CFG.startZ + (CFG.magiFront - CFG.mangerZ)*s);   // z della mangiatoia
  nat = new THREE.Group(); nat.position.set(0, 0, manger); root.add(nat);
  const shTex = shadowTexture();
  for (const [x, z, w, d] of [[0, -.56, 5.4, 4.6], [-.39, 4.24, 2.6, 2.8]]){   // sotto la paglia e sotto i Magi
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2),
      new THREE.MeshBasicMaterial({ map:shTex, transparent:true, depthWrite:false, opacity:.6, toneMapped:false }));
    sh.scale.set(w*s, 1, d*s); sh.position.set(x*s, .004, z*s); sh.renderOrder = 0; nat.add(sh);
  }
  if (CFG.showStar){
    starObj = makeStar(); starObj.position.set(0, CFG.starY, 0); nat.add(starObj);
  }

  const glow = glowTexture();
  const glowTex = new THREE.CanvasTexture(glow.c); glowTex.colorSpace = THREE.SRGBColorSpace;
  const n = STATIONS.length;

  STATIONS.forEach((st, i) => {
    // i poster stanno ai lati della natività, accanto ai personaggi di cui parlano, e si girano un po’ verso di te
    const grp = new THREE.Group();
    grp.position.set(st.side * CFG.sideX, 0, manger + st.zm*s);
    grp.rotation.y = -st.side * (Math.PI/2 - CFG.turn);

    const tex = new THREE.CanvasTexture(drawPoster(st, i, n));
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    const poster = new THREE.Group();
    poster.position.set(0, CFG.posterY, 0);
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(CFG.posterW, CFG.posterH),
      new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthWrite:false, side:THREE.DoubleSide, toneMapped:false }));
    glass.renderOrder = 2;
    const halo = new THREE.Mesh(new THREE.PlaneGeometry(CFG.posterW*glow.sx, CFG.posterH*glow.sy),
      new THREE.MeshBasicMaterial({ map:glowTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, opacity:.2, toneMapped:false }));
    halo.position.z = -.004; halo.renderOrder = 1;
    poster.add(halo, glass);

    grp.add(poster); root.add(grp);
    stations.push({ poster, halo, h:0, visited:false, dwell:0 });
  });

  // la guida (il logo) e il mirino per riposizionare la natività
  guide.grp = new THREE.Group(); guide.grp.visible = false; scene.add(guide.grp);
  const gMat = new THREE.MeshBasicMaterial({ transparent:true, side:THREE.DoubleSide, depthWrite:false, toneMapped:false });
  new THREE.TextureLoader().load(CFG.guide, tx => { tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8; gMat.map = tx; gMat.needsUpdate = true; });
  guide.logo = new THREE.Mesh(new THREE.PlaneGeometry(CFG.guideSize, CFG.guideSize), gMat); guide.logo.renderOrder = 3;
  guide.hit = new THREE.Mesh(new THREE.PlaneGeometry(CFG.guideSize*1.9, CFG.guideSize*1.9),
    new THREE.MeshBasicMaterial({ map:softGlow(), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, opacity:.35, toneMapped:false }));
  guide.hit.position.z = -.01; guide.hit.renderOrder = 2;
  guide.bCanvas = document.createElement("canvas"); guide.bCanvas.width = 1024; guide.bCanvas.height = 460;
  guide.bTex = new THREE.CanvasTexture(guide.bCanvas); guide.bTex.colorSpace = THREE.SRGBColorSpace; guide.bTex.anisotropy = 8;
  guide.bubble = new THREE.Mesh(new THREE.PlaneGeometry(.64, .287), new THREE.MeshBasicMaterial({ map:guide.bTex, transparent:true, depthWrite:false, toneMapped:false }));
  guide.bubble.position.set(0, CFG.guideSize*.5 + .17, 0); guide.bubble.scale.setScalar(.001); guide.bubble.renderOrder = 4;
  guide.grp.add(guide.hit, guide.logo, guide.bubble);

  reticle = new THREE.Mesh(new THREE.RingGeometry(.14, .18, 40).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({ color:0xffd27a, transparent:true, opacity:.9, toneMapped:false }));
  reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);

  for (let i=0;i<2;i++){
    const ctl = renderer.xr.getController(i);
    ctl.addEventListener("squeezestart", () => {      // grip: sposta la natività dove guardi sul pavimento
      if (!S.placed) return;
      if (hitSrc){ placeMode = !placeMode; reticle.visible = false;
        say(placeMode ? "Guarda il pavimento dove vuoi la natività e premi il grilletto." : "Va bene, la lascio dov’è.", 5); }
      else place();
    });
    ctl.addEventListener("select", () => onSelect(ctl));  // grilletto o pinch: conferma la posizione o tocca la guida
    scene.add(ctl);
  }
  renderer.setAnimationLoop(render);
  addEventListener("resize", () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    if (!renderer.xr.isPresenting) renderer.setSize(innerWidth, innerHeight);
  });
}

// Mette la natività sul pavimento (di default davanti a te); gli spostamenti successivi sono dolci
function place(x = head.x, y = 0, z = head.z){
  S.tx = x; S.ty = y; S.tz = z; S.tyaw = Math.atan2(-fwd.x, -fwd.z);
  if (!S.placed){ root.position.set(x, y, z); root.rotation.y = S.tyaw; S.placed = true; S.placedAt = -1; }
  root.visible = true;
}
const ray = new THREE.Raycaster(), qTmp = new THREE.Quaternion(), sTmp = new THREE.Vector3();
function onSelect(ctl){
  if (placeMode && reticle.visible){
    reticle.matrix.decompose(v1, qTmp, sTmp);
    place(v1.x, v1.y, v1.z); placeMode = false; reticle.visible = false; say("Fatto! La natività è qui.", 4); return;
  }
  if (!guide.grp.visible) return;
  ray.setFromXRController(ctl);
  if (ray.intersectObject(guide.hit).length) say(GUIDE.tips[guide.tipI++ % GUIDE.tips.length], 8);
}

/* ---------- Sessione AR ---------- */
async function startAR(){
  playSong();   // parte col tocco sul bottone: i browser non permettono l’audio prima di un gesto
  try {
    session = await navigator.xr.requestSession("immersive-ar", {
      optionalFeatures: ["local-floor","bounded-floor","hand-tracking","hit-test","light-estimation"]
    });
  } catch (e) { fadeSong(0); setStatus("Impossibile avviare la sessione AR: " + e.message); return; }
  await renderer.xr.setSession(session);
  ui.classList.add("hidden");
  last = null; startTime = 0; S.placed = false; root.visible = false; placeMode = false;
  guide.introDone = false; guide.ready = false; guide.msgUntil = 0; guide.nudgeAt = 0; guide.endAt = 0; stations.forEach(st => { st.visited = false; st.dwell = 0; });
  session.requestReferenceSpace("viewer").then(vs => session.requestHitTestSource({ space:vs })).then(src => { hitSrc = src; }).catch(() => {});
  renderer.xr.getReferenceSpace()?.addEventListener?.("reset", () => { S.placed = false; startTime = 0; });   // se il visore ricentra la stanza
  session.addEventListener("end", () => {
    session = null; hitSrc = null; placeMode = false; reticle.visible = false; fadeSong(0); ui.classList.remove("hidden");
    setStatus("Sessione terminata. Puoi rientrare quando vuoi.");
    startBtn.textContent = "Rientra nell’esperienza";
  }, { once:true });
}

/* ---------- Aggiornamento per frame ---------- */
function update(dt, t){
  const cam = renderer.xr.getCamera();
  head.setFromMatrixPosition(cam.matrixWorld);
  cam.getWorldDirection(look);
  fwd.set(look.x, 0, look.z);
  if (fwd.lengthSq() < 1e-4) fwd.set(0,0,-1);
  fwd.normalize();

  if (!startTime) startTime = t;
  if (!S.placed){
    if (t - startTime < CFG.spawnDelay) return;
    place();
  }
  if (S.placedAt < 0) S.placedAt = t;
  const kp = 1 - Math.exp(-dt*4);               // spostamento dolce della natività
  root.position.x += (S.tx - root.position.x)*kp; root.position.y += (S.ty - root.position.y)*kp; root.position.z += (S.tz - root.position.z)*kp;
  root.rotation.y += Math.atan2(Math.sin(S.tyaw - root.rotation.y), Math.cos(S.tyaw - root.rotation.y))*kp;
  const since = t - S.placedAt, cosGaze = Math.cos(THREE.MathUtils.degToRad(CFG.gazeDeg));

  // la natività compare per prima, poi i poster uno dopo l’altro
  nat.scale.setScalar(Math.max(0.001, easeOutBack(clamp01(since/1.0))));
  if (starObj){
    starObj.rotation.y = t*.8;
    starObj.position.y = CFG.starY + Math.sin(t*1.3)*.02;
    starObj.userData.mesh.material.emissiveIntensity = 1.3 + .3*Math.sin(t*2.2);
  }

  stations.forEach((s, i) => {
    const a = since - .5 - i*0.3;
    const e2 = Math.max(0.001, easeOutBack(clamp01(a/0.8)));

    // poster: leggero galleggiamento + alone quando lo guardi
    s.poster.getWorldPosition(tmp).sub(head); const dist = tmp.length(); tmp.normalize();
    const looking = tmp.dot(look) > cosGaze, target = looking ? 1 : 0;
    s.dwell = Math.max(0, s.dwell + ((looking && dist < CFG.near && a > 1) ? dt : -dt*.5));   // lo stai leggendo?
    if (s.dwell > 1.6 && !s.visited){ s.visited = true; onVisit(i); }
    s.h += (target - s.h) * (1 - Math.exp(-dt*6));
    s.poster.scale.setScalar(e2 * (1 + .03*s.h));
    s.poster.position.y = CFG.posterY + Math.sin(t*.9 + i)*.015;
    s.halo.material.opacity = .2 + .8*s.h;
  });
  updateGuide(dt, t, since);
}

function render(time, frame){
  const t = time/1000;
  if (placeMode && frame && hitSrc){
    const r = frame.getHitTestResults(hitSrc), pose = r.length && r[0].getPose(renderer.xr.getReferenceSpace());
    if (pose){ reticle.matrix.fromArray(pose.transform.matrix); reticle.visible = true; } else reticle.visible = false;
  }
  if (last === null) last = t;
  const dt = Math.min(t - last, 0.05); last = t;
  if (renderer.xr.isPresenting && nat) update(dt, t);
  renderer.render(scene, camera);
}

/* ---------- Avvio ---------- */
function refreshButton(){
  if (!xrOK || !modelOK) return;
  startBtn.disabled = false; startBtn.textContent = "Entra nella realtà mista";
  setStatus("Pronto. Guardati intorno: la Natività compare da sola.");
}
async function checkXR(){
  if (!navigator.xr){ setStatus("Questo browser non espone WebXR. Apri il sito nel browser del Meta Quest."); return; }
  xrOK = await navigator.xr.isSessionSupported("immersive-ar").catch(() => false);
  if (!xrOK){ startBtn.textContent = "Realtà mista non disponibile"; setStatus("La modalità immersive-ar non è disponibile in questo browser."); return; }
  refreshButton();
}
startBtn.addEventListener("click", startAR);
init();
setupSong();
loadNativity().then(m => { nat.add(m); modelOK = true; refreshButton(); })
  .catch(e => { console.error(e); setStatus("Non riesco a caricare " + CFG.model + ". Controlla che il file sia nella cartella models."); });
checkXR();
</script>
